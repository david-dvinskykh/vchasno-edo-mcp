name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go vet ./...
      - run: go test ./... -count=1
      - run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o vchasno-edo-mcp ./cmd/vchasno-edo-mcp
